services:
  omada-controller:
    container_name: omada-controller

    image: mbentley/omada-controller:5.15

    restart: unless-stopped

    stop_grace_period: 60s

    # Host networking is recommended for Omada.
    # This allows discovery/adoption traffic to work
    # without manually mapping every Omada port.
    network_mode: host

    ulimits:
      nofile:
        soft: 4096
        hard: 8192

    environment:

      # Timezone
      TZ: America/Chicago

      # Omada management
      MANAGE_HTTP_PORT: 8088
      MANAGE_HTTPS_PORT: 8043

      # Guest portal
      PORTAL_HTTP_PORT: 8088
      PORTAL_HTTPS_PORT: 8843

      # Omada discovery / management
      PORT_APP_DISCOVERY: 27001
      PORT_DISCOVERY: 29810
      PORT_MANAGER_V1: 29811
      PORT_ADOPT_V1: 29812
      PORT_UPGRADE_V1: 29813
      PORT_MANAGER_V2: 29814
      PORT_TRANSFER_V2: 29815
      PORT_RTTY: 29816

      # Logging
      SHOW_SERVER_LOGS: "true"
      SHOW_MONGODB_LOGS: "false"

    volumes:
      # Persistent Omada configuration
      - ./data:/opt/tplink/EAPController/data

      # Persistent logs
      - ./logs:/opt/tplink/EAPController/logs